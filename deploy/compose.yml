services:
  app:
    image: ${RELEASE_IMAGE:?Definir RELEASE_IMAGE}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      JWT_SECRET_FILE: /run/secrets/jwt
      CORS_ORIGIN: ${CORS_ORIGIN:?Definir origen HTTPS}
      DB_PATH: /data/database.db
      UPLOAD_DIR: /data/uploads
    secrets:
      - jwt
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  jwt:
    file: ./secrets/jwt
